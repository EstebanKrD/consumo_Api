<div class="app-shell">
  <header class="app-header">
    <div class="brand">Mesa de Ayuda</div>

    <nav>
      <a routerLink="/tickets" routerLinkActive="active">Tickets</a>
      @if (currentUser()?.role === 'admin') {
        <a routerLink="/users" routerLinkActive="active">Usuarios</a>
      }
    </nav>

    <div class="user-info">
      @if (currentUser(); as user) {
        <span class="user-name">{{ user.name }} <span class="user-role">({{ user.role }})</span></span>
      }
      <button type="button" class="logout-btn" (click)="logout()">Cerrar sesión</button>
    </div>
  </header>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
